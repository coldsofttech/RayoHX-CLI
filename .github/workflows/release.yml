name: Release

# Publishes to PyPI when a GitHub release is published (tag vX.Y.Z), using trusted publishing (no
# stored tokens). Builds the command line (rayohx-cli) as compiled wheels (one Nuitka .pyd on
# Windows, .so elsewhere) with cibuildwheel, one per OS, architecture and Python version, with no
# sdist. Release rayohx (core) first: rayohx-cli depends on it on PyPI.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    name: check tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Check tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' src/rayohx_cli/__init__.py)"
          [ -n "$version" ] && [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match version $version"; exit 1; }

  build:
    name: build (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Build the compiled wheels
        uses: pypa/cibuildwheel@v4.3.5
        with:
          output-dir: dist
      - name: Upload the distribution files
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.whl

  publish:
    name: publish (PyPI)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the distribution files
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
