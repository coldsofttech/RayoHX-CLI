name: Release

# Runs when a GitHub release is published with a tag vX.Y.Z. It builds the command line (rayohx-cli)
# as compiled wheels (one Nuitka .pyd on Windows, .so elsewhere) with cibuildwheel, one per OS,
# architecture and Python version, with no sdist and so no .py sources. Once the `cli` environment is
# approved (Settings > Environments), it publishes them to PyPI with trusted publishing (no stored
# tokens) and attaches them to the release, with a portable one-folder command line for Windows
# (.zip) and Linux, x64 and arm64 (.tar.gz), frozen with PyInstaller.
#
# The tag must match __version__ in src/rayohx_cli/__init__.py. rayohx-cli depends on the rayohx
# package on PyPI, so release core (RayoHX) first.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  check:
    name: check tag
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Check tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' src/rayohx_cli/__init__.py)"
          [ -n "$version" ] && [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match version $version"; exit 1; }

  # One job per OS and Python version, so the wheels build in parallel.
  build:
    name: build (${{ matrix.os }}, cp${{ matrix.python }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
        python: ["311", "312", "313", "314", "315"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Build the compiled wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: cp${{ matrix.python }}-*
        with:
          output-dir: dist
      - name: Upload the distribution files
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}-cp${{ matrix.python }}
          path: dist/*.whl

  # The portable command line (one folder, frozen with PyInstaller) for Windows and Linux, built from
  # the compiled wheel of the newest Python.
  freeze:
    name: freeze (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          sync: "false"
      - name: Download the wheel
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.os }}-cp315
          path: dist/
      - name: Freeze the command line with PyInstaller
        shell: bash
        run: uv run --no-project --with packaging python scripts/build.py --no-build --wheels dist
      - name: Upload the portable command line
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish (PyPI)
    needs: [build, freeze]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cli
    permissions:
      contents: write # attach files to the release
      id-token: write # PyPI trusted publishing
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Download the distribution files
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach the files to the release
        uses: ./.github/actions/attach-release-files
