name: Security

# Static analysis (Semgrep), with the findings sent to code scanning.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Scan with Semgrep
        uses: ./.github/actions/semgrep
        with:
          configs: p/python p/owasp-top-ten
          category: semgrep
