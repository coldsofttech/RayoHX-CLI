name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: Run the pre-commit checks
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: pytest # covered by the test job across all Python versions

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: Run the unit tests
        run: uv run pytest

  integration:
    name: integration (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: Run the integration tests
        run: uv run pytest -m integration --no-cov

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
      - name: Build the packages
        run: PYD_BUILD=1 uv build --wheel
      - name: Check the package metadata
        run: uvx twine check --strict dist/*
      - name: Check the wheel holds the compiled command line, stubs and no sources
        run: |
          unzip -l dist/rayohx_cli-*.whl > wheel.txt
          grep -qE " rayohx_cli\..*\.(so|pyd)$" wheel.txt
          grep -qE " rayohx_cli/__init__\.pyi$" wheel.txt
          if grep -E " rayohx_cli.*\.py$" wheel.txt; then
            echo "the compiled wheel must not hold .py sources"; exit 1
          fi
      - name: Smoke test the built wheel
        run: uvx --from dist/rayohx_cli-*.whl rayohx --version

  # Single required status check for the branch ruleset.
  ci:
    name: ci (required check)
    if: always()
    needs: [lint, test, integration, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          echo "lint:        ${{ needs.lint.result }}"
          echo "test:        ${{ needs.test.result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "build:       ${{ needs.build.result }}"
          [ "${{ needs.lint.result }}" = success ] &&
          [ "${{ needs.test.result }}" = success ] &&
          [ "${{ needs.integration.result }}" = success ] &&
          [ "${{ needs.build.result }}" = success ]
