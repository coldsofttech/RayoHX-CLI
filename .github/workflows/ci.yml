name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
      - name: Run the pre-commit checks
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: pytest # covered by the test job across all Python versions
      - name: Check dependency licenses
        run: uv run pip-licenses --from=mixed --partial-match --fail-on="GPL" --format=plain

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the unit tests
        run: uv run pytest

  int-tests:
    name: int-tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the integration tests
        run: uv run pytest -m integration --no-cov

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          sync: "false"
      - name: Build the packages
        run: PYD_BUILD=1 uv build --wheel
      - name: Check the package metadata
        run: uvx twine check --strict dist/*
      - name: Check the wheel holds the compiled command line, stubs and no sources
        run: |
          unzip -l dist/rayohx_cli-*.whl > wheel.txt
          grep -qE " rayohx_cli\..*\.(so|pyd)$" wheel.txt
          grep -qE " rayohx_cli/__init__\.pyi$" wheel.txt
          if grep -E " rayohx_cli.*\.py$" wheel.txt; then
            echo "the compiled wheel must not hold .py sources"; exit 1
          fi
      - name: Smoke test the built wheel
        run: uvx --from dist/rayohx_cli-*.whl rayohx --version

  # The portable command line frozen with PyInstaller, then its Windows setup or Linux packages,
  # installed and removed again.
  installers:
    name: installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          sync: "false"
      - name: Install the installer tools
        uses: ./.github/actions/install-installer-tools
      - name: Build the compiled wheel, freeze it and build the setup or packages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then installer=--setup; else installer=--packages; fi
          uv run --no-project --with packaging python scripts/build.py "$installer"
      - name: Install and uninstall the setup
        if: runner.os == 'Windows'
        uses: ./.github/actions/test-setup
      - name: Install and remove the Linux packages
        if: runner.os == 'Linux'
        uses: ./.github/actions/test-linux-packages

  # Single required status check for the branch ruleset.
  ci:
    name: ci (required check)
    if: always()
    needs: [lint, test, int-tests, build, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
